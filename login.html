<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f6f1">
	<title>Sign in | Shija Dialysis</title>
	<style>
		:root { color-scheme: light; --paper: #f4f6f1; --ink: #1d302a; --muted: #718078; --green: #216b53; --coral: #a83c30; }
		* { box-sizing: border-box; }
		body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; grid-template-columns: minmax(280px, 1fr) minmax(380px, .9fr); background: var(--paper); color: var(--ink); font: 14px/1.45 "Aptos", "Segoe UI", sans-serif; }
		.brand-panel { display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; padding: 38px clamp(28px, 7vw, 100px); background: #e7efe8; }
		.brand-logo { width: min(285px, 80%); height: auto; }
		.brand-copy { max-width: 440px; padding: 70px 0; }
		.eyebrow { margin: 0 0 12px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
		h1 { margin: 0; font: 400 clamp(34px, 4vw, 54px)/1.08 Georgia, "Times New Roman", serif; }
		.brand-copy p:last-child { max-width: 370px; margin: 17px 0 0; color: #52635a; font-size: 15px; }
		.brand-foot { color: #617269; font-size: 12px; }
		.login-panel { display: grid; place-items: center; min-height: 100vh; padding: 38px; }
		.login-box { width: min(100%, 390px); }
		.login-box h2 { margin: 0; font: 400 29px/1.2 Georgia, "Times New Roman", serif; }
		.intro { margin: 8px 0 30px; color: var(--muted); }
		.field { display: grid; gap: 7px; margin-top: 17px; }
		label { color: #52635a; font-size: 12px; font-weight: 700; }
		input { width: 100%; height: 46px; padding: 0 12px; border: 1px solid #d9e1da; border-radius: 5px; background: white; color: var(--ink); font: inherit; outline-color: #78a38c; }
		input:focus-visible, button:focus-visible { outline: 2px solid #48866a; outline-offset: 2px; }
		button { width: 100%; height: 45px; margin-top: 23px; border: 1px solid var(--green); border-radius: 5px; background: var(--green); color: white; cursor: pointer; font: 650 14px "Aptos", "Segoe UI", sans-serif; }
		button:hover { background: #185740; }
		button:disabled { cursor: wait; opacity: .7; }
		.error { min-height: 20px; margin: 13px 0 0; color: var(--coral); font-size: 12px; }
		@media (max-width: 700px) { body { grid-template-columns: 1fr; } .brand-panel { min-height: auto; padding: 24px 7vw 20px; } .brand-logo { width: 210px; } .brand-copy { padding: 35px 0 10px; } .brand-copy h1 { font-size: 34px; } .brand-copy p:last-child, .brand-foot { display: none; } .login-panel { min-height: auto; padding: 30px 7vw 48px; } }
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
	</style>
</head>
<body>
	<section class="brand-panel" aria-label="Shija Dialysis">
		<img class="brand-logo" src="/shija-logo.png" alt="Shija Hospitals &amp; Research Institute Pvt. Ltd.">
		<div class="brand-copy"><p class="eyebrow">Shija Dialysis</p><h1>Patient records, kept in view.</h1><p>Sign in to continue to the patient records workspace.</p></div>
		<div class="brand-foot">Shija Hospitals &amp; Research Institute</div>
	</section>
	<main class="login-panel">
		<form class="login-box" id="login-form">
			<h2>Welcome back</h2>
			<p class="intro">Sign in with your authorized account.</p>
			<div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" value="admin" required autofocus></div>
			<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
			<button id="submit-button" type="submit">Sign in</button>
			<p class="error" id="error-message" role="alert" aria-live="polite"></p>
		</form>
	</main>
	<script>
		const form = document.querySelector('#login-form');
		const button = document.querySelector('#submit-button');
		const errorMessage = document.querySelector('#error-message');
		form.addEventListener('submit', async event => {
			event.preventDefault();
			errorMessage.textContent = '';
			button.disabled = true;
			button.textContent = 'Signing in...';
			try {
				const response = await fetch('/api/login', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ username: form.elements.username.value, password: form.elements.password.value })
				});
				const result = await response.json();
				if (!response.ok) throw new Error(result.message || 'Could not sign in.');
				window.location.assign('/');
			} catch (error) {
				errorMessage.textContent = error.message || 'Could not connect. Please try again.';
				button.disabled = false;
				button.textContent = 'Sign in';
			}
		});
	</script>
</body>
</html>
